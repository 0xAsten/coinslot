<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Slot</title>
  <meta name="description" content="Original arcade games that run inside Claude Code while it works.">
  <meta property="og:description" content="Original arcade games that run inside Claude Code while it works.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="wall">
    <button id="mute" type="button" aria-label="Mute" aria-pressed="false">♪</button>
    <div id="grid"></div>
    <div id="stick" aria-hidden="true"><div id="base"></div><div id="shaft"><div id="ball"></div></div></div>
    <a id="down" href="#about" aria-label="About">↓</a>
  </main>
  <section id="about">
    <p class="lede">Original arcade games that run inside Claude Code while it works.</p>
    <h2>Make a game</h2>
    <ol class="steps">
      <li><span>1</span> Fork the repo</li>
      <li><span>2</span> Paste the prompt into your agent</li>
      <li><span>3</span> Your agent opens a pull request</li>
      <li><span>4</span> After review, your game joins the wall</li>
    </ol>
    <div class="prompt">
      <pre><code id="prompt"></code></pre>
      <button id="copy-prompt" type="button">⧉ Copy prompt</button>
    </div>
    <p class="links">
      <a href="https://x.com/0xasten">@0xasten</a>
      <a href="https://github.com/beasaltfish/coinslot">GitHub</a>
    </p>
  </section>
  <script type="module" src="main.js"></script>
</body>
</html>

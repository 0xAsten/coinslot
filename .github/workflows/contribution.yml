name: contribution

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Screening a contributor's PR is a separate workflow (contribution-screen.yml,
# pull_request_target) so it runs main's code. This one runs the PR's own tests.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test site scripts
      - run: npx -y -p typescript@5.9.3 tsc -p site/tsconfig.json

name: contribution

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Screen with main's copy of the checker, before any PR code runs, so a PR
      # cannot edit the checker (or package.json scripts) to wave itself through.
      - name: Check out main's checker
        run: git worktree add ../coinslot-base origin/main
      - name: Install the checker
        working-directory: ../coinslot-base
        run: bun install --frozen-lockfile
      - name: Screen the contribution
        run: bun ../coinslot-base/scripts/check-contribution.ts origin/main
      - run: bun install --frozen-lockfile
      - run: bun test site scripts
      - run: npx -y -p typescript@5.9.3 tsc -p site/tsconfig.json

name: contribution-screen

# pull_request_target runs this file and the checker as they are on main, never the PR's.
# The PR head is laid out only to be read: nothing in pr/ is installed, built or executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  screen:
    # owner, members and collaborators are the author's side; everyone else is screened
    if: github.event.pull_request.author_association != 'OWNER' && github.event.pull_request.author_association != 'MEMBER' && github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/checkout refuses fork code under pull_request_target, and that is the right instinct:
      # so the PR head is not checked out by an action. It is fetched as data from this repo's own
      # refs/pull/N/head and laid out as a worktree that nothing installs, builds or runs.
      - name: Fetch the PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "pull/${PR_NUMBER}/head"
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "The PR moved since this run was queued; the newer run screens it."
            exit 1
          fi
          git worktree add --detach pr "$HEAD_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # main's own lockfile, main's own checkout; the PR directory is not touched
      - name: Install the checker's dependencies (main only)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Screen the contribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # --no-types: the engine types are not in the repo, so the type layer runs locally at merge time
        run: bun scripts/check-contribution.ts --no-types --root pr "$BASE_SHA"
